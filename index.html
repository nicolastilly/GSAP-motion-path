<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GSAP Motion Path</title>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MotionPathPlugin.min.js"></script>

    <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

  <style>
    html,
    body {
      position: relative;
      height: 100%;
    }

    body {
      background: #FAEB92;
      font-family: Helvetica Neue, Helvetica, Arial, sans-serif;
      font-size: 14px;
      color: #fff;
      margin: 0;
      padding: 0;
      overflow-y: hidden;
    }

    .container {
      width: 90vw;
      height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #svg-stage {
      width: 60%;
      max-width: 500px;
      overflow: visible;
    }


    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>


      <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide">

      </div>

      <div class="swiper-slide">

      </div>


      <div class="swiper-slide">
        <svg id="svg-stage" viewBox="0 0 229 236" fill="none" xmlns="http://www.w3.org/2000/svg">
<path id="monPath3" d="M8.92688 100.683C8.92688 100.683 39.56 59.3418 65.9269 63.1833C103.603 68.6726 82.9269 159.183 82.9269 159.183C66.2602 153.017 33.9269 139.983 37.9269 137.183C41.9269 134.383 136.427 70.1833 136.427 70.1833C136.427 70.1833 180.727 238.483 171.927 231.683C163.127 224.883 108.927 84.85 82.9269 15.6833L25.9269 8.18332C25.9269 8.18332 -4.57312 238.35 52.9269 220.683C110.427 203.017 224.427 165.983 220.427 159.183C216.427 152.383 175.76 60.6833 155.927 15.6833C136.094 -29.3167 220.427 70.1833 220.427 70.1833L8.92688 100.683Z" stroke="black" stroke-width="8"/>

</svg>

      </div>
    </div>


    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>





  <div class="container">

  </div>



    <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>



  <script>

    var swiper = new Swiper(".mySwiper", {
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });


    gsap.registerPlugin(MotionPathPlugin);

    gsap.to("#dot", {
      duration: 8,
      repeat: -1,
      ease: "none",
      motionPath: {
        path: "#monPath",
        align: "#monPath",
        alignOrigin: [0.5, 0.5]
      }
    });

        gsap.to("#dot2", {
      duration: 19,
      repeat: -1,
      ease: "none",
      motionPath: {
        path: "#monPath2",
        align: "#monPath2",
        alignOrigin: [0.5, 0.5]
      }
    });

            gsap.to("#dot3", {
      duration: 19,
      repeat: -1,
      ease: "expo.out",
      motionPath: {
        path: "#monPath3",
        align: "#monPath3",
        alignOrigin: [0.5, 0.5]
      }
    });
    
  </script>
</body>
</html>
